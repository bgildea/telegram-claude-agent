[project]
name = "telegram-claude-agent"
version = "0.1.0"
description = "A small, tested Telegram assistant on Claude: tool use, memory, guardrails and an eval suite"
authors = [{ name = "Barry Gildea" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "evals"]
